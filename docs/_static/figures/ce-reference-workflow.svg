<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" role="img" aria-labelledby="title desc"><title id="title">Conventional prediction and the CE workflow</title><desc id="desc">Labelled data are separated into training, calibration and evaluation roles. A fitted model predicts conventionally. CE uses the same model and separate labelled calibration data; new-case features support prediction information and factual or alternative explanations. Individual results can be interpreted; evaluation uses separate labelled test cases. Blue identifies conventional data and prediction steps; orange identifies the CE route. Background transparent.</desc><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker></defs><rect x="300" y="190" width="690" height="375" rx="20" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="9 6"/><path d="M20 80H5V265H15" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#b)"/><path d="M5 265V455H15" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#b)"/><path d="M5 455V645H15" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#b)"/><path d="M250 265H280V85H315" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#b)"/><path d="M620 85H675" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#b)"/><path d="M470 140V245" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#o)"/><path d="M250 455H280V310H315" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#o)"/><path d="M620 310H675" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#o)"/><path d="M620 310H645V485H675" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#o)"/><path d="M620 475H660V350H675" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#b)"/><path d="M620 495H675" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#b)"/><path d="M250 645H675" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#b)"/><path d="M980 85H995V680H985" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#b)"/><path d="M980 305H995V680H985" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#o)"/><path d="M980 485H995V680H985" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#o)"/><rect x="20" y="30" width="230" height="100" rx="14" fill="#e8f1ff" stroke="#2563eb" stroke-width="2"/><text x="135.0" y="62" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#17346b">Labelled data</text><text x="135.0" y="89" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#17346b">Split into separate roles.</text><rect x="20" y="210" width="230" height="110" rx="14" fill="#e8f1ff" stroke="#2563eb" stroke-width="2"/><text x="135.0" y="242" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#17346b">Training set</text><text x="135.0" y="269" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#17346b">Used to fit the model.</text><rect x="20" y="400" width="230" height="110" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="135.0" y="432" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#7c2d12">Calibration set</text><text x="135.0" y="459" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#7c2d12">Not used for model fitting.</text><rect x="20" y="590" width="230" height="110" rx="14" fill="#e8f1ff" stroke="#2563eb" stroke-width="2"/><text x="135.0" y="622" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#17346b">Test / evaluation set</text><text x="135.0" y="649" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#17346b">Held-out features + targets.</text><rect x="320" y="30" width="300" height="110" rx="14" fill="#e8f1ff" stroke="#2563eb" stroke-width="2"/><text x="470.0" y="62" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#17346b">Fit or reuse the model</text><text x="470.0" y="89" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#17346b">Same fitted model in both routes.</text><rect x="680" y="30" width="300" height="110" rx="14" fill="#e8f1ff" stroke="#2563eb" stroke-width="2"/><text x="830.0" y="62" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#17346b">Conventional prediction</text><text x="830.0" y="89" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#17346b">Class, value or score</text><text x="830.0" y="112" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#17346b">for a new case.</text><rect x="320" y="250" width="300" height="120" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="470.0" y="282" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#7c2d12">Calibrate with CE</text><text x="470.0" y="309" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#7c2d12">Fitted model + labelled data</text><text x="470.0" y="332" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#7c2d12">Method depends on the mode.</text><rect x="320" y="430" width="300" height="110" rx="14" fill="#e8f1ff" stroke="#2563eb" stroke-width="2"/><text x="470.0" y="462" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#17346b">New-case features</text><text x="470.0" y="489" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#17346b">Choose your output question.</text><text x="470.0" y="512" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#17346b">No query target is required.</text><rect x="680" y="245" width="300" height="120" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="830.0" y="277" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#7c2d12">Prediction information</text><text x="830.0" y="304" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#7c2d12">Probability or numeric prediction</text><text x="830.0" y="327" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#7c2d12">with mode-specific ranges.</text><rect x="680" y="425" width="300" height="130" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="830.0" y="457" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#7c2d12">Explanations</text><text x="830.0" y="484" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#7c2d12">Factual: conditions + weight ranges</text><text x="830.0" y="507" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#7c2d12">Alternatives: predictions + ranges</text><rect x="680" y="620" width="300" height="130" rx="14" fill="#e8f1ff" stroke="#2563eb" stroke-width="2"/><text x="830.0" y="652" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#17346b">Interpret and evaluate</text><text x="830.0" y="679" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#17346b">Read individual results.</text><text x="830.0" y="702" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#17346b">Check on held-out labelled cases.</text><rect x="600" y="195" width="365" height="43" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="782.5" y="227" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#7c2d12">Added by CE</text><rect x="20" y="795" width="410" height="43" rx="14" fill="#e8f1ff" stroke="#2563eb" stroke-width="2"/><text x="225.0" y="827" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#17346b">Blue: conventional workflow / inputs</text><rect x="470" y="795" width="510" height="43" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="725.0" y="827" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#7c2d12">Orange: CE calibration / explanation route</text></svg>