<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1660" role="img" aria-labelledby="title desc"><title id="title">CE tasks, output questions and explanation capabilities</title><desc id="desc">A predictive task depends on the target: classification includes binary and multiclass; regression has a numerical target. Classification asks about class probabilities. A fitted regressor supports numerical-value intervals or event-probability questions. Factual explanations compare responses under feature conditions; alternatives report predictions under other conditions. Output scales and range meanings depend on the selected question. These are conceptual routes, not three unrelated predictive tasks or a guarantee that every extension supports every configuration.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<g class="node"><rect x="12" y="12" width="336" height="48" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="45.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Task → question → explanation</text>
</g>
<g class="node"><rect x="22" y="85" width="316" height="90" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="115.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Classification</text>
<text x="180.0" y="139.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Categorical target</text>
<text x="180.0" y="163.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Binary or multiclass</text>
</g>
<path d="M180 175V205" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<g class="node"><rect x="22" y="205" width="316" height="112" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="180.0" y="246.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Class-probability question</text>
<text x="180.0" y="270.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Which class, and how probable?</text>
<text x="180.0" y="294.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Class probabilities + bounds</text>
</g>
<g class="node"><rect x="22" y="365" width="316" height="90" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="395.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Regression</text>
<text x="180.0" y="419.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Numerical target</text>
<text x="180.0" y="443.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">The same fitted regressor</text>
</g>
<path d="M180 455V485" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<g class="node"><rect x="22" y="485" width="316" height="112" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="180.0" y="526.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Value-and-interval question</text>
<text x="180.0" y="550.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">What value, with what interval?</text>
<text x="180.0" y="574.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Prediction in target units</text>
</g>
<rect x="63.27000000000001" y="617" width="233.45999999999998" height="27" rx="5" fill="#ffffff"/>
<text x="180" y="635" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155">OR ask about an event</text>
<g class="node"><rect x="22" y="675" width="316" height="112" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="180.0" y="716.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Event-probability question</text>
<text x="180.0" y="740.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">How probable is Y ≤ t?</text>
<text x="180.0" y="764.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Probability + bounds</text>
</g>
<g class="node"><rect x="12" y="855" width="336" height="48" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="888.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">For the selected output question</text>
</g>
<g class="node"><rect x="22" y="935" width="316" height="130" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="180.0" y="973.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Factual explanation</text>
<text x="180.0" y="997.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Conditions holding for this case</text>
<text x="180.0" y="1021.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Compare model responses</text>
<text x="180.0" y="1045.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Weight + its reported range</text>
</g>
<g class="node"><rect x="22" y="1105" width="316" height="130" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="180.0" y="1143.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Alternative explanation</text>
<text x="180.0" y="1167.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Consider another condition</text>
<text x="180.0" y="1191.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Read its prediction + range</text>
<text x="180.0" y="1215.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">No causal effect is established</text>
</g>
<g class="node"><rect x="22" y="1285" width="316" height="112" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="1326.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Keep the scale consistent</text>
<text x="180.0" y="1350.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Class / event: probability scale</text>
<text x="180.0" y="1374.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Value: numerical target units</text>
</g>
<g class="node"><rect x="22" y="1440" width="316" height="130" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="1478.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Read the method’s conditions</text>
<text x="180.0" y="1502.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Probability bounds differ from</text>
<text x="180.0" y="1526.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">target-value prediction intervals.</text>
<text x="180.0" y="1550.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Weight ranges are distinct.</text>
</g>
<rect x="-15.95999999999998" y="1604" width="391.91999999999996" height="25" rx="5" fill="#ffffff"/>
<text x="180" y="1620" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="400" fill="#334155">Optional extensions need a support check.</text>
</svg>
