<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1450" role="img" aria-labelledby="title desc"><title id="title">Conventional prediction and the CE workflow</title><desc id="desc">Labelled data are separated into training, calibration and evaluation roles. A fitted model predicts conventionally. CE uses the same model and separate labelled calibration data; new-case features support prediction information and factual or alternative explanations. Individual results can be interpreted; evaluation uses separate labelled test cases. Blue identifies conventional data and prediction steps; orange identifies the CE route. Background transparent.</desc><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker></defs><rect x="10" y="485" width="340" height="715" rx="20" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="9 6"/><path d="M180 120V165" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#b)"/><path d="M180 290V335" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#b)"/><path d="M340 230H351V580H344" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#o)"/><path d="M180 650V700" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#o)"/><path d="M180 805V855" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#o)"/><path d="M340 760H351V1105H344" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#o)"/><path d="M20 390H5V1320H16" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#b)"/><path d="M340 920H351V1320H344" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#o)"/><path d="M340 1105H351V1320H344" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#o)"/><rect x="20" y="20" width="320" height="100" rx="14" fill="#e8f1ff" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="52" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#17346b">Labelled data</text><text x="180.0" y="79" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#17346b">Separate training, calibration</text><text x="180.0" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#17346b">and evaluation roles.</text><rect x="20" y="170" width="320" height="120" rx="14" fill="#e8f1ff" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#17346b">Training → fitted model</text><text x="180.0" y="229" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#17346b">Fit using training data,</text><text x="180.0" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#17346b">or reuse an already fitted model.</text><rect x="20" y="340" width="320" height="100" rx="14" fill="#e8f1ff" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="372" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#17346b">Conventional prediction</text><text x="180.0" y="399" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#17346b">Class, numerical value or score</text><text x="180.0" y="422" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#17346b">for a new case.</text><rect x="20" y="510" width="320" height="140" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="180.0" y="542" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#7c2d12">CE calibration</text><text x="180.0" y="569" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#7c2d12">Same fitted model + separate</text><text x="180.0" y="592" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#7c2d12">labelled calibration data.</text><text x="180.0" y="615" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#7c2d12">The method depends on the mode.</text><rect x="20" y="705" width="320" height="100" rx="14" fill="#e8f1ff" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="737" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#17346b">Query the calibrated system</text><text x="180.0" y="764" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#17346b">New-case features + question</text><text x="180.0" y="787" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#17346b">No query target is required.</text><rect x="20" y="860" width="320" height="120" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="180.0" y="892" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#7c2d12">Prediction information</text><text x="180.0" y="919" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#7c2d12">Probability or numeric prediction,</text><text x="180.0" y="942" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#7c2d12">with mode-specific ranges.</text><rect x="20" y="1035" width="320" height="140" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="180.0" y="1067" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#7c2d12">Factual and alternatives</text><text x="180.0" y="1094" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#7c2d12">Factual: conditions + weight ranges.</text><text x="180.0" y="1117" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#7c2d12">Alternatives: predictions + ranges.</text><rect x="20" y="1250" width="320" height="150" rx="14" fill="#e8f1ff" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="1282" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#17346b">Interpret and evaluate</text><text x="180.0" y="1309" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#17346b">Read individual results.</text><text x="180.0" y="1332" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#17346b">Check on separate labelled test data.</text><text x="180.0" y="1355" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#17346b">One result does not establish validity.</text></svg>