<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1110" role="img" aria-labelledby="title desc"><title id="title">Regression: event probability</title><desc id="desc">Prepare the fitted predictive model using training features and targets. Separate labelled calibration data configure CE around that same model. Evaluate by querying held-out test features and comparing outputs with held-out targets; test targets do not enter prediction or explanation. At inference, reuse the same fitted model and CE calibration state with new-case features; no query target is needed. Calibration state and reference data remain part of the CE system. White denotes conventional inputs and activities; orange denotes CE additions. Arrows show information flow, not required API calls. Range meanings and guarantees depend on the selected method and its conditions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<g class="node"><rect x="12" y="12" width="1076" height="48" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="550.0" y="45.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">1 · Prepare the system — development</text>
</g>
<path d="M335 128H375" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
