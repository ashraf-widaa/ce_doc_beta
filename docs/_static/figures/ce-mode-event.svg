<text x="180.0" y="151.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Features + known targets</text>
</g>
<g class="node"><rect x="375" y="75" width="335" height="110" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="542.5" y="127.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Fit a regressor</text>
<text x="542.5" y="151.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Produces the fitted model</text>
</g>
<g class="node"><rect x="750" y="250" width="325" height="110" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="912.5" y="290.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Configured CE system</text>
<text x="912.5" y="314.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Keep this fitted model</text>
<text x="912.5" y="338.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Reuse CE state for queries</text>
</g>
<g class="node"><rect x="25" y="250" width="310" height="110" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="180.0" y="302.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Calibration data</text>
<text x="180.0" y="326.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Separate features + targets</text>
</g>
<g class="node"><rect x="375" y="250" width="335" height="110" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="542.5" y="290.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">CPS scores + Venn–Abers</text>
<text x="542.5" y="314.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Fitted model + CE state</text>
<text x="542.5" y="338.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Includes calibration references</text>
</g>
<rect x="769.75" y="99" width="274.5" height="27" rx="5" fill="#ffffff"/>
<text x="907" y="117" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155">CE adds calibration state</text>
