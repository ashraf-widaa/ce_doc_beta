<text x="180.0" y="662.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Test targets</text>
<text x="180.0" y="686.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Known outcomes; kept aside</text>
</g>
<g class="node"><rect x="750" y="615" width="325" height="100" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="912.5" y="662.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Check results</text>
<text x="912.5" y="686.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Compare outputs with targets</text>
</g>
<g class="node"><rect x="12" y="760" width="1076" height="48" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="550.0" y="793.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">3 · Use the system — inference with a new case</text>
</g>
