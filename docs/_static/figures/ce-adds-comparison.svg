<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1470" role="img" aria-labelledby="title desc"><title id="title">What CE adds to a basic conventional ML workflow</title><desc id="desc">Two lanes share the same fitted predictive model. Conventional ML: training data fit the model; at inference, an instance (test data or a new case; features only) goes to that model, which returns a class, numerical value or score. With CE: the same fitted model, not retrained, plus separate labelled calibration data configure a CE system whose calibration method is set by the task and mode; at inference, the same instance goes to that system, which returns prediction information with a mode-specific range, a factual explanation (which conditions in this case contribute: feature weights with ranges) and alternative explanations (what the model would report under other feature conditions: predictions with ranges). Held-out evaluation is separate: test features obtain outputs from the model or CE system; test targets are used only to check those outputs and never enter prediction or explanation. White marks conventional parts, orange marks CE additions. Conventional systems can also use other calibration or explanation tools; this compares CE with a basic model-only workflow. Arrows show information flow, not API calls.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<g class="node"><rect x="25" y="12" width="500" height="52" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="275.0" y="47.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Conventional ML</text>
</g>
<g class="node"><rect x="575" y="12" width="500" height="52" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="825.0" y="47.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">With CE</text>
</g>
<path d="M25 82H1075" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 6"/>
<rect x="361.45000000000005" y="82" width="377.09999999999997" height="27" rx="5" fill="#ffffff"/>
<text x="550" y="100" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155">PREPARATION · done once, before use</text>
<path d="M275 205V235" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M695 325V355" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M955 325V355" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M525 280H575" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<g class="node"><rect x="25" y="115" width="500" height="90" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="275.0" y="157.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Training data</text>
<text x="275.0" y="181.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Features + known targets</text>
</g>
<g class="node"><rect x="25" y="235" width="500" height="90" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="275.0" y="277.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Fitted predictive model</text>
<text x="275.0" y="301.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Learns from the training data</text>
</g>
<rect x="612.51" y="133" width="424.97999999999996" height="26" rx="5" fill="#ffffff"/>
<text x="825" y="150" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#334155">CE starts from the model you already have,</text>
<rect x="622.2" y="161" width="405.59999999999997" height="26" rx="5" fill="#ffffff"/>
<text x="825" y="178" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#334155">plus separate labelled calibration data.</text>
<g class="node"><rect x="575" y="235" width="240" height="90" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="695.0" y="277.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Same fitted model</text>
<text x="695.0" y="301.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Reused, not retrained</text>
</g>
<g class="node"><rect x="835" y="235" width="240" height="90" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="955.0" y="265.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Calibration data</text>
<text x="955.0" y="289.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Separate labelled cases:</text>
<text x="955.0" y="313.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">features + targets</text>
</g>
<g class="node"><rect x="575" y="355" width="500" height="90" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="825.0" y="385.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Configured CE system</text>
<text x="825.0" y="409.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Same model + calibration state</text>
<text x="825.0" y="433.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Method set by task and mode</text>
</g>
<path d="M25 482H1075" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 6"/>
<rect x="346.06000000000006" y="482" width="407.87999999999994" height="27" rx="5" fill="#ffffff"/>
<text x="550" y="500" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155">INFERENCE · repeated for each instance</text>
<path d="M275 600V630" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M275 720V750" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M825 600V630" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M825 720V750" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M575 690H555V915H575" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M555 915V1035H575" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M25 280H12V675H25" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M1075 400H1088V675H1075" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<g class="node"><rect x="25" y="520" width="500" height="80" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="275.0" y="557.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Instance (test data / new case)</text>
<text x="275.0" y="581.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Features only; the target is not needed</text>
</g>
<g class="node"><rect x="575" y="520" width="500" height="80" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="825.0" y="557.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Same instance (test data / new case)</text>
<text x="825.0" y="581.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Features only; the target is not needed</text>
</g>
<g class="node"><rect x="25" y="630" width="500" height="90" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="275.0" y="672.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Same fitted model</text>
<text x="275.0" y="696.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Unchanged from preparation</text>
</g>
<g class="node"><rect x="575" y="630" width="500" height="90" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="825.0" y="672.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Same configured CE system</text>
<text x="825.0" y="696.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Model + calibration state, reused</text>
</g>
<g class="node"><rect x="25" y="750" width="500" height="90" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="275.0" y="792.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Model output</text>
<text x="275.0" y="816.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Class, numerical value or score</text>
</g>
<g class="node"><rect x="575" y="750" width="500" height="90" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="825.0" y="780.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Prediction information</text>
<text x="825.0" y="804.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Probability or numerical value</text>
<text x="825.0" y="828.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">with a mode-specific range</text>
</g>
<g class="node"><rect x="575" y="870" width="500" height="90" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="825.0" y="900.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Factual explanation</text>
<text x="825.0" y="924.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Which conditions in this case contribute?</text>
<text x="825.0" y="948.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Feature weights with ranges</text>
</g>
<g class="node"><rect x="575" y="990" width="500" height="90" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="825.0" y="1020.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Alternative explanations</text>
<text x="825.0" y="1044.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">What if a feature condition were different?</text>
<text x="825.0" y="1068.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Predictions with ranges</text>
</g>
<rect x="60.80000000000001" y="889" width="428.4" height="25" rx="5" fill="#ffffff"/>
<text x="275" y="905" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="400" fill="#334155">A basic model reports no range or explanation</text>
<rect x="101.84" y="915" width="346.32" height="25" rx="5" fill="#ffffff"/>
<text x="275" y="931" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="400" fill="#334155">by itself; other tools can add them.</text>
<path d="M25 1138H1075" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 6"/>
<rect x="279.37" y="1138" width="541.26" height="27" rx="5" fill="#ffffff"/>
<text x="550" y="1156" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155">HELD-OUT EVALUATION · before relying on either lane</text>
<path d="M245 1220H285" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M555 1220H595" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M815 1220H855" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M965 1310V1265" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<g class="node"><rect x="25" y="1175" width="220" height="90" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="135.0" y="1217.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Test features</text>
<text x="135.0" y="1241.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Query inputs only</text>
</g>
<g class="node"><rect x="285" y="1175" width="270" height="90" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="420.0" y="1217.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Same fitted model</text>
<text x="420.0" y="1241.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">or same CE system</text>
</g>
<g class="node"><rect x="595" y="1175" width="220" height="90" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="705.0" y="1205.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Test outputs</text>
<text x="705.0" y="1229.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Predictions or</text>
<text x="705.0" y="1253.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">explanations</text>
</g>
<g class="node"><rect x="855" y="1175" width="220" height="90" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="965.0" y="1205.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Check results</text>
<text x="965.0" y="1229.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Compare outputs</text>
<text x="965.0" y="1253.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">with test targets</text>
</g>
<g class="node"><rect x="855" y="1310" width="220" height="90" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="965.0" y="1340.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Test targets</text>
<text x="965.0" y="1364.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Known outcomes,</text>
<text x="965.0" y="1388.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">kept aside</text>
</g>
<rect x="246.58" y="1327" width="366.84" height="27" rx="5" fill="#ffffff"/>
<text x="430" y="1345" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155">Test targets go only to the check.</text>
<rect x="200.41000000000003" y="1355" width="459.17999999999995" height="27" rx="5" fill="#ffffff"/>
<text x="430" y="1373" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155">They never enter prediction or explanation.</text>
<rect x="103.24000000000001" y="1422" width="893.52" height="25" rx="5" fill="#ffffff"/>
<text x="550" y="1438" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="400" fill="#334155">White: conventional ML and data · Orange: what CE adds · Arrows: information flow, not API calls</text>
</svg>
