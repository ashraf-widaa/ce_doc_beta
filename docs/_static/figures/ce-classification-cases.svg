xt x="675.0" y="197" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#431407">Versicolor bounds: [0.902, 0.992]</text><text x="675.0" y="233" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#431407">Other cases can expose bound limits.</text></svg>