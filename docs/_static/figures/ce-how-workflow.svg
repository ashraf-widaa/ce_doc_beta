<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 355" role="img" aria-labelledby="title desc"><title id="title">CE workflow: fit, calibrate, predict and explain</title><desc id="desc">Orange boxes show fitting on training data, calibration with separate labelled data, then two operations on the calibrated system: prediction information and factual or alternative explanations. Both operations use new-case features. Prediction is not a required separate call before explanation. The background is transparent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker></defs><path d="M250 182H300" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M575 182H610V82H650" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M575 182H610V272H650" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="15" y="110" width="235" height="145" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="132.5" y="144" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7c2d12">1 · Fit the model</text><text x="132.5" y="173" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Training features</text><text x="132.5" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">and known targets.</text><rect x="305" y="110" width="270" height="145" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="440.0" y="144" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7c2d12">2 · Calibrate with CE</text><text x="440.0" y="173" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Same fitted model + separate</text><text x="440.0" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">labelled calibration data.</text><rect x="655" y="25" width="290" height="115" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="800.0" y="59" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7c2d12">3 · Prediction information</text><text x="800.0" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Choose task/mode; read the</text><text x="800.0" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">output and its range.</text><rect x="655" y="215" width="290" height="115" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="800.0" y="249" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7c2d12">4 · Explanations</text><text x="800.0" y="278" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Factual conditions and weights;</text><text x="800.0" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">alternative predictions.</text><text x="655" y="181" font-family="sans-serif" font-size="13" fill="#b45309">Both operations use new-case features.</text></svg>