<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 2570" role="img" aria-labelledby="title desc"><title id="title">What CE adds to a basic conventional ML workflow</title><desc id="desc">Two lanes share the same fitted predictive model. Conventional ML: training data fit the model; at inference, an instance (test data or a new case; features only) goes to that model, which returns a class, numerical value or score. With CE: the same fitted model, not retrained, plus separate labelled calibration data configure a CE system whose calibration method is set by the task and mode; at inference, the same instance goes to that system, which returns prediction information with a mode-specific range, a factual explanation (which conditions in this case contribute: feature weights with ranges) and alternative explanations (what the model would report under other feature conditions: predictions with ranges). Held-out evaluation is separate: test features obtain outputs from the model or CE system; test targets are used only to check those outputs and never enter prediction or explanation. White marks conventional parts, orange marks CE additions. Conventional systems can also use other calibration or explanation tools; this compares CE with a basic model-only workflow. Arrows show information flow, not API calls.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
