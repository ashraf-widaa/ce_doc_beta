<text x="180.0" y="604.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Class, numerical value</text>
<text x="180.0" y="628.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">or score</text>
