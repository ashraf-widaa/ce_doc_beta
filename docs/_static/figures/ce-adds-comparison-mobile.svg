<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 2440" role="img" aria-labelledby="title desc"><title id="title">What CE adds to a basic conventional ML workflow</title><desc id="desc">Two lanes share the same fitted predictive model. Conventional ML: training data fit the model; at inference, new-case features go to that model, which returns a class, numerical value or score. With CE: the same fitted model, not retrained, plus separate labelled calibration data configure a CE system; at inference, the same new-case features go to that system, which returns prediction information with a mode-specific range, and factual or alternative explanations with ranges. Held-out evaluation is separate: test features obtain outputs from the model or CE system; test targets are used only to check those outputs and never enter prediction or explanation. White marks conventional parts, orange marks CE additions. Conventional systems can also use other calibration or explanation tools; this compares CE with a basic model-only workflow. Arrows show information flow, not API calls.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<g class="node"><rect x="12" y="12" width="336" height="48" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="45.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Conventional ML</text>
</g>
