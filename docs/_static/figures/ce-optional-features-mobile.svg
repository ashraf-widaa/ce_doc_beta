<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1260" role="img" aria-labelledby="title desc"><title id="title">Optional CE features have different jobs</title><desc id="desc">Mondrian calibration uses group information at calibration and query time. Guarding checks selected candidate representatives during explanation construction. Conjunctions combine feature conditions. Alternative filters select generated alternative rules. Rejection handles queried cases under a configured criterion, with setup requirements. These features are not five required stages; verify support and conditions for the task, mode and software version. Guarding is not universal query out-of-distribution detection or case rejection.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<g class="node"><rect x="12" y="12" width="336" height="48" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="45.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Optional CE features</text>
</g>
<g class="node"><rect x="22" y="90" width="316" height="58" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="128.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">At calibration</text>
</g>
<path d="M180 148V172" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<g class="node"><rect x="22" y="172" width="316" height="102" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="180.0" y="220.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Mondrian calibration</text>
<text x="180.0" y="244.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Use defined calibration groups.</text>
</g>
<g class="node"><rect x="22" y="306" width="316" height="58" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="344.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">During explanation building</text>
</g>
<path d="M180 364V388" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<g class="node"><rect x="22" y="388" width="316" height="102" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="180.0" y="436.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Guarding</text>
<text x="180.0" y="460.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Check candidate representatives.</text>
</g>
<g class="node"><rect x="22" y="522" width="316" height="58" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="560.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">When combining conditions</text>
</g>
<path d="M180 580V604" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<g class="node"><rect x="22" y="604" width="316" height="102" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="180.0" y="640.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Conjunctions</text>
<text x="180.0" y="664.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Combine feature conditions</text>
<text x="180.0" y="688.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">into rules.</text>
</g>
<g class="node"><rect x="22" y="738" width="316" height="58" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="776.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">After alternative generation</text>
</g>
<path d="M180 796V820" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<g class="node"><rect x="22" y="820" width="316" height="102" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="180.0" y="868.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Alternative filtering</text>
<text x="180.0" y="892.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Select rules by a stated criterion.</text>
</g>
<g class="node"><rect x="22" y="954" width="316" height="58" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="992.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">For case handling</text>
</g>
<path d="M180 1012V1036" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<g class="node"><rect x="22" y="1036" width="316" height="102" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="180.0" y="1084.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Rejection / defer handling</text>
<text x="180.0" y="1108.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Flag cases under a configured rule.</text>
</g>
<rect x="-22.799999999999983" y="1178" width="405.59999999999997" height="26" rx="5" fill="#ffffff"/>
<text x="180.0" y="1195" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#334155">These are options, not mandatory stages.</text>
<rect x="-42.17999999999998" y="1207" width="444.35999999999996" height="26" rx="5" fill="#ffffff"/>
<text x="180.0" y="1224" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#334155">Check support, prerequisites and conditions.</text>
</svg>
