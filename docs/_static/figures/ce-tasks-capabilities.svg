<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1030" role="img" aria-labelledby="title desc"><title id="title">CE tasks, output questions and explanation capabilities</title><desc id="desc">A predictive task depends on the target: classification includes binary and multiclass; regression has a numerical target. Classification asks about class probabilities. A fitted regressor supports numerical-value intervals or event-probability questions. Factual explanations compare responses under feature conditions; alternatives report predictions under other conditions. Output scales and range meanings depend on the selected question. These are conceptual routes, not three unrelated predictive tasks or a guarantee that every extension supports every configuration.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<g class="node"><rect x="12" y="12" width="1076" height="48" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="550.0" y="45.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Task: what kind of target does the model learn?</text>
</g>
<g class="node"><rect x="25" y="95" width="325" height="105" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="187.5" y="132.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Classification</text>
<text x="187.5" y="156.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Categorical target</text>
<text x="187.5" y="180.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Binary (2) or multiclass (3+)</text>
</g>
<g class="node"><rect x="390" y="95" width="685" height="105" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="732.5" y="144.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Regression</text>
<text x="732.5" y="168.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Numerical target · the same fitted regressor can answer either question</text>
</g>
<path d="M187 200V290" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M732 200V245H552V290" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M732 245H912V290" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<g class="node"><rect x="25" y="290" width="325" height="135" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="187.5" y="342.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Classification</text>
<text x="187.5" y="366.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Which class, and how probable?</text>
<text x="187.5" y="390.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Class probabilities + bounds</text>
</g>
<g class="node"><rect x="390" y="290" width="325" height="135" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="552.5" y="342.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Interval regression</text>
<text x="552.5" y="366.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">What value, with what interval?</text>
<text x="552.5" y="390.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Value + interval in target units</text>
</g>
<g class="node"><rect x="750" y="290" width="325" height="135" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="912.5" y="342.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Probabilistic regression</text>
<text x="912.5" y="366.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">How probable is Y ≤ t?</text>
<text x="912.5" y="390.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Event probability + bounds</text>
</g>
<rect x="181.90000000000003" y="455" width="736.1999999999999" height="29" rx="5" fill="#ffffff"/>
<text x="550" y="475" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#334155">Mode: choose the output quantity before interpreting its range.</text>
<g class="node"><rect x="12" y="515" width="1076" height="48" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="550.0" y="548.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Capabilities: explain the response for your chosen question</text>
</g>
<g class="node"><rect x="25" y="605" width="510" height="150" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="280.0" y="653.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Factual explanation</text>
<text x="280.0" y="677.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Conditions holding for the case</text>
<text x="280.0" y="701.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Compare model responses</text>
<text x="280.0" y="725.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Report weights with their ranges</text>
</g>
<g class="node"><rect x="565" y="605" width="510" height="150" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="820.0" y="653.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Alternative explanation</text>
<text x="820.0" y="677.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Consider another feature condition</text>
<text x="820.0" y="701.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Report the resulting prediction and range</text>
<text x="820.0" y="725.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">A model comparison, not a causal effect</text>
</g>
<g class="node"><rect x="25" y="805" width="1050" height="95" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="550.0" y="849.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Factual weights use the selected scale</text>
<text x="550.0" y="873.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Class / event → probability differences · Numerical value → differences in target units</text>
</g>
<rect x="80.72500000000002" y="926" width="938.55" height="28" rx="5" fill="#ffffff"/>
<text x="550" y="945" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="400" fill="#334155">A probability bound, target-value interval and weight range are different quantities.</text>
<rect x="89.56000000000006" y="962" width="920.8799999999999" height="27" rx="5" fill="#ffffff"/>
<text x="550" y="980" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Optional extensions have task-, mode- and configuration-specific support and conditions.</text>
</svg>
