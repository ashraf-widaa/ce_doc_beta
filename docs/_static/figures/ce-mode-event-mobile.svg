<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1100" role="img" aria-labelledby="title desc"><title id="title">Event-probability regression workflow</title><desc id="desc">Event-probability regression. A fitted model and separate labelled calibration data support the method-specific calibration. New-case features produce prediction information and explanations. Each range needs its own interpretation and assumptions; no additional statistical guarantee is asserted. Transparent background.</desc><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker></defs><path d="M180 150V195" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#b)"/><path d="M20 265H9V610H16" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#o)"/><path d="M180 475V535" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#o)"/><path d="M340 265H351V865H344" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#o)"/><path d="M340 430H351V865H344" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#o)"/><rect x="20" y="25" width="320" height="125" rx="14" fill="#e8f1ff" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="57" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#17346b">Regressor + calibration data</text><text x="180.0" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#17346b">Numeric target; define event Y ≤ t.</text><rect x="20" y="200" width="320" height="130" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="180.0" y="232" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#7c2d12">CPS scores → Venn–Abers</text><text x="180.0" y="259" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#7c2d12">Threshold-event calibration.</text><rect x="20" y="390" width="320" height="85" rx="14" fill="#e8f1ff" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="422" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#17346b">New-case features</text><text x="180.0" y="449" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#17346b">Choose the question / event.</text><rect x="20" y="540" width="320" height="145" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="180.0" y="572" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#7c2d12">P(Y ≤ t) + probability bounds</text><text x="180.0" y="599" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#7c2d12">Probability scale, not target units.</text><text x="180.0" y="622" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#7c2d12">Threshold t uses target units.</text><rect x="20" y="785" width="320" height="160" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="180.0" y="817" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#7c2d12">Factual and alternatives</text><text x="180.0" y="844" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#7c2d12">Factual: event-probability differences.</text><text x="180.0" y="867" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#7c2d12">Alternatives: event probabilities.</text></svg>