<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">Classification workflow</title><desc id="desc">Classification. A fitted model and separate labelled calibration data support the method-specific calibration. New-case features produce prediction information and explanations. Each range needs its own interpretation and assumptions; no additional statistical guarantee is asserted. Transparent background.</desc><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker></defs><path d="M310 105H345" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#b)"/><path d="M650 105H685" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#o)"/><path d="M650 105H670V435H655" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#o)"/><path d="M650 280H670V155H685" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#b)"/><path d="M500 325V360" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#b)"/><rect x="20" y="35" width="290" height="140" rx="14" fill="#e8f1ff" stroke="#2563eb" stroke-width="2"/><text x="165.0" y="67" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#17346b">Classifier + calibration data</text><text x="165.0" y="94" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#17346b">Binary or multiclass target.</text><rect x="350" y="35" width="300" height="140" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="500.0" y="67" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#7c2d12">Venn–Abers</text><text x="500.0" y="94" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#7c2d12">Class-probability information.</text><rect x="690" y="35" width="290" height="150" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="835.0" y="67" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#7c2d12">Class + probabilities</text><text x="835.0" y="94" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#7c2d12">Reported probability bounds.</text><text x="835.0" y="117" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#7c2d12">Not a target-value interval.</text><rect x="350" y="240" width="300" height="85" rx="14" fill="#e8f1ff" stroke="#2563eb" stroke-width="2"/><text x="500.0" y="272" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#17346b">New-case features</text><text x="500.0" y="299" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#17346b">Choose the question / event.</text><rect x="350" y="365" width="300" height="150" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="500.0" y="397" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#7c2d12">Factual and alternatives</text><text x="500.0" y="424" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#7c2d12">Factual: class-probability differences.</text><text x="500.0" y="447" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#7c2d12">Alternatives: class probabilities.</text></svg>