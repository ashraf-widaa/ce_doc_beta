<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 770" role="img" aria-labelledby="title desc"><title id="title">Optional CE features have different jobs</title><desc id="desc">Mondrian calibration uses group information at calibration and query time. Guarding checks selected candidate representatives during explanation construction. Conjunctions combine feature conditions. Alternative filters select generated alternative rules. Rejection handles queried cases under a configured criterion, with setup requirements. These features are not five required stages; verify support and conditions for the task, mode and software version. Guarding is not universal query out-of-distribution detection or case rejection.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<g class="node"><rect x="12" y="12" width="1076" height="48" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="550.0" y="45.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Optional CE features</text>
</g>
<g class="node"><rect x="25" y="95" width="435" height="93" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="242.5" y="150.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">At calibration</text>
</g>
