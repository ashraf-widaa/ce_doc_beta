</g>
<path d="M460 498H510" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<g class="node"><rect x="510" y="452" width="565" height="93" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="792.5" y="495.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Alternative filtering</text>
<text x="792.5" y="519.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Select rules by a stated criterion.</text>
</g>
