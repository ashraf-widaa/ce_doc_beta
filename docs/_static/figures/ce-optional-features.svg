<g class="node"><rect x="510" y="95" width="565" height="93" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="792.5" y="138.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Mondrian calibration</text>
<text x="792.5" y="162.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Use defined calibration groups.</text>
</g>
<g class="node"><rect x="25" y="214" width="435" height="93" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="242.5" y="269.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">During explanation building</text>
</g>
<path d="M460 260H510" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<g class="node"><rect x="510" y="214" width="565" height="93" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="792.5" y="257.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Guarding</text>
<text x="792.5" y="281.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Check candidate representatives.</text>
</g>
<g class="node"><rect x="25" y="333" width="435" height="93" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="242.5" y="388.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">When combining conditions</text>
</g>
<path d="M460 379H510" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<g class="node"><rect x="510" y="333" width="565" height="93" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="792.5" y="376.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Conjunctions</text>
<text x="792.5" y="400.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Combine feature conditions in rules.</text>
</g>
