<text x="792.5" y="614.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Rejection / defer handling</text>
<text x="792.5" y="638.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Flag cases under a configured rule.</text>
</g>
<rect x="347.20000000000005" y="688" width="405.59999999999997" height="26" rx="5" fill="#ffffff"/>
<text x="550.0" y="705" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#334155">These are options, not mandatory stages.</text>
