<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">What CE adds to a conventional prediction workflow</title><desc id="desc">White boxes show training and prediction. Orange boxes add separate labelled calibration data, CE using the same model, prediction information and explanations. The figure background is transparent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker></defs><path d="M225 105 H276" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M490 105 H661" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M250 335 H306" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M385 145 V286" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M535 335 H600 V285 H661" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M535 335 H600 V425 H661" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="15" y="65" width="210" height="80" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2"/><text x="120.0" y="97" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">1 · Training data</text><text x="120.0" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Features + known targets</text><rect x="280" y="65" width="210" height="80" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2"/><text x="385.0" y="97" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">2 · Fitted model</text><text x="385.0" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Features of a new case</text><rect x="665" y="65" width="275" height="80" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2"/><text x="802.5" y="97" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Conventional prediction</text><text x="802.5" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Class, value or score</text><rect x="15" y="290" width="235" height="90" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="132.5" y="322" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">3 · Calibration data</text><text x="132.5" y="347" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Separate labelled cases</text><rect x="310" y="290" width="225" height="90" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="422.5" y="322" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">CE + same fitted model</text><text x="422.5" y="347" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Features of the new case</text><rect x="665" y="240" width="275" height="90" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="802.5" y="272" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">4 · Prediction information</text><text x="802.5" y="297" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Mode-specific output + range</text><rect x="665" y="380" width="275" height="90" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="802.5" y="412" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Factual + alternatives</text><text x="802.5" y="437" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Model responses + ranges</text><text x="20" y="470" font-family="sans-serif" font-size="13" fill="#a64b0a">White: conventional steps · Orange: CE additions</text></svg>