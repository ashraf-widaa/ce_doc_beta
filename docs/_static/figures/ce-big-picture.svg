<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">What Calibrated Explanations adds to a supervised prediction workflow</title>
  <desc id="desc">White boxes show model fitting and conventional prediction. Orange boxes show separate labelled calibration data and CE using the same fitted model and new-case features. CE provides prediction information with a task-specific range, factual conditions with comparison weights and ranges, and alternative conditions with predictions and ranges. The four output boxes distinguish quantities, not a required order of API calls. The background is transparent.</desc>
  <defs>
    <marker id="ml" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10Z" fill="#64748b" />
    </marker>
    <marker id="ce" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10Z" fill="#c2410c" />
    </marker>
  </defs>
  <path d="M260 138 H340" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ml)" />
  <path d="M580 138 H700" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ml)" />
  <path d="M260 260 H300 V153 H340" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ml)" />
  <path d="M460 176 V400" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ce)" />
  <path d="M260 438 H340" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ce)" />
  <path d="M260 260 H300 V452 H340" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ce)" />
  <path d="M580 438 H640 V334 H700" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ce)" />
  <path d="M580 438 H640 V420 H700" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ce)" />
  <path d="M580 438 H640 V506 H700" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ce)" />
  <path d="M580 438 H640 V592 H700" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ce)" />
  <g class="box">
    <rect x="20" y="18" width="540" height="42" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <text x="290.0" y="45.5" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f2937">Conventional supervised prediction</text>
  </g>
  <g class="box">
    <rect x="20" y="100" width="240" height="76" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <text x="140.0" y="135.0" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1f2937">Training data</text>
    <text x="140.0" y="157.0" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">Features and known targets</text>
  </g>
  <g class="box">
    <rect x="340" y="100" width="240" height="76" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <text x="460.0" y="135.0" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1f2937">Fitted model</text>
    <text x="460.0" y="157.0" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">Fit on training data</text>
  </g>
  <g class="box">
    <rect x="700" y="100" width="360" height="76" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <text x="880.0" y="135.0" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1f2937">Conventional prediction</text>
    <text x="880.0" y="157.0" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">A class, value or score</text>
  </g>
  <g class="box">
    <rect x="20" y="225" width="240" height="70" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <text x="140.0" y="257.0" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1f2937">New case</text>
    <text x="140.0" y="279.0" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">Features; target not supplied</text>
  </g>
  <g class="box">
    <rect x="340" y="242" width="240" height="54" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <text x="460.0" y="264.5" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f2937">Same fitted model</text>
    <text x="460.0" y="286.5" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">CE does not retrain it</text>
  </g>
  <g class="box">
    <rect x="20" y="325" width="240" height="42" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text x="140.0" y="352.5" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#9a3412">Added by CE</text>
  </g>
  <g class="box">
    <rect x="20" y="400" width="240" height="76" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text x="140.0" y="435.0" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#9a3412">Calibration data</text>
    <text x="140.0" y="457.0" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">Separate labelled cases</text>
  </g>
  <g class="box">
    <rect x="340" y="400" width="240" height="76" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text x="460.0" y="435.0" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#9a3412">Calibrated Explanations</text>
    <text x="460.0" y="457.0" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">Calibration + explanations</text>
  </g>
  <g class="box">
    <rect x="700" y="300" width="360" height="68" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text x="880.0" y="331.0" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#9a3412">Prediction</text>
    <text x="880.0" y="353.0" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">Class probability, event probability or value</text>
  </g>
  <g class="box">
    <rect x="700" y="386" width="360" height="68" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text x="880.0" y="417.0" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#9a3412">Reported range</text>
    <text x="880.0" y="439.0" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">Probability bounds OR target-value interval</text>
  </g>
  <g class="box">
    <rect x="700" y="472" width="360" height="68" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text x="880.0" y="503.0" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#9a3412">Factual explanation</text>
    <text x="880.0" y="525.0" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">Condition + comparison weight + range</text>
  </g>
  <g class="box">
    <rect x="700" y="558" width="360" height="68" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text x="880.0" y="589.0" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#9a3412">Alternative explanation</text>
    <text x="880.0" y="611.0" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">Different condition + prediction + range</text>
  </g>
  <g class="box">
    <rect x="20" y="555" width="560" height="70" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <text x="300.0" y="585.5" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f2937">White: conventional steps · Orange: CE additions</text>
    <text x="300.0" y="607.5" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Outputs distinguish quantities, not four required calls.</text>
  </g>
</svg>