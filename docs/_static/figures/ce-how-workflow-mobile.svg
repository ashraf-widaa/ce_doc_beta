<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 840" role="img" aria-labelledby="title desc"><title id="title">CE workflow: fit, calibrate, predict and explain</title><desc id="desc">Orange boxes show fitting on training data, calibration with separate labelled data, then two operations on the calibrated system: prediction information and factual or alternative explanations. Both operations use new-case features. Prediction is not a required separate call before explanation. The background is transparent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker></defs><path d="M180 150V190" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M180 335V350H10V467H16" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M340 265H351V685H344" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="25" width="320" height="125" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="180.0" y="59" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7c2d12">1 · Fit the predictive model</text><text x="180.0" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Use training features</text><text x="180.0" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">and known targets.</text><rect x="20" y="195" width="320" height="140" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="180.0" y="229" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7c2d12">2 · Calibrate with CE</text><text x="180.0" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Use the fitted model and</text><text x="180.0" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">separate labelled calibration data.</text><rect x="20" y="405" width="320" height="125" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="180.0" y="439" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7c2d12">3 · Read prediction information</text><text x="180.0" y="468" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Choose a task/mode; read the</text><text x="180.0" y="490" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">output and its reported range.</text><rect x="20" y="610" width="320" height="150" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="180.0" y="644" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7c2d12">4 · Inspect an explanation</text><text x="180.0" y="673" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Factual: conditions and weights.</text><text x="180.0" y="695" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Alternatives: predictions under</text><text x="180.0" y="717" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">different feature conditions.</text><text x="20" y="385" font-family="sans-serif" font-size="13" fill="#b45309">Both operations below use new-case features.</text><text x="20" y="800" font-family="sans-serif" font-size="13" fill="#b45309">Prediction and explanation are separate choices.</text></svg>