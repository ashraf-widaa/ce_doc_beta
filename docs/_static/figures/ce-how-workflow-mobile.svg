<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1010" role="img" aria-labelledby="title desc"><title id="title">From a fitted model to calibrated prediction information and explanations</title><desc id="desc">Four orange stages: fit using training data, calibrate using separate labelled data, then use new-case features to request prediction information or explanations from the same calibrated system. The two output branches are independent operations. The background is transparent; a dashed box identifies the new-case input.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker></defs><path d="M180 165V205" fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M180 365V405" fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M180 475V500H9V605H16" fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M180 500H351V835H344" fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="20" y="25" width="320" height="140" rx="16" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="180.0" y="64" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#431407">1 · Fit the model</text><text x="180.0" y="103" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#431407">Training features + known targets</text><text x="180.0" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#431407">→ fitted predictive model</text><rect x="20" y="210" width="320" height="155" rx="16" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="180.0" y="249" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#431407">2 · Calibrate with CE</text><text x="180.0" y="288" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#431407">Fitted model + separate labelled data</text><text x="180.0" y="315" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#431407">→ calibrated system</text><rect x="20" y="530" width="320" height="150" rx="16" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="180.0" y="569" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#431407">3 · Prediction information</text><text x="180.0" y="608" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#431407">Class, value or event probability</text><text x="180.0" y="635" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#431407">Read its quantity, units and range.</text><rect x="20" y="750" width="320" height="170" rx="16" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="180.0" y="789" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#431407">4 · Explanations</text><text x="180.0" y="828" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#431407">Factual: conditions + weight ranges</text><text x="180.0" y="855" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#431407">Alternatives: predictions + ranges</text><rect x="20" y="410" width="320" height="65" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><text x="180.0" y="437" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#431407">Query the calibrated system</text><text x="180.0" y="459" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="normal" fill="#431407">New-case features + your question</text></svg>