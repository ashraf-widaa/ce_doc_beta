<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 990" role="img" aria-labelledby="title desc"><title id="title">What CE adds to a conventional prediction workflow</title><desc id="desc">White boxes show training and prediction. Orange boxes add separate labelled calibration data, CE using the same model, prediction information and explanations. The figure background is transparent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker></defs><path d="M180 115 V141" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M180 215 V241" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M180 470 V516" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M180 600 V646" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M180 735 V781" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M340 180 H351 V505 H180 V516" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="45" width="320" height="70" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2"/><text x="180.0" y="77" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937">1 · Labelled training data</text><text x="180.0" y="102" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Features + known targets</text><rect x="20" y="145" width="320" height="70" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2"/><text x="180.0" y="177" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937">2 · Fitted model</text><text x="180.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Predict for a new case</text><rect x="20" y="245" width="320" height="70" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2"/><text x="180.0" y="277" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937">Conventional prediction</text><text x="180.0" y="302" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Class, value or score</text><rect x="20" y="390" width="320" height="80" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="180.0" y="422" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937">3 · Calibration data</text><text x="180.0" y="447" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Separate labelled cases</text><rect x="20" y="520" width="320" height="80" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="180.0" y="552" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937">CE + same fitted model</text><text x="180.0" y="577" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Features of the new case</text><rect x="20" y="650" width="320" height="85" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="180.0" y="682" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937">4 · Prediction information</text><text x="180.0" y="707" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Mode-specific output + range</text><rect x="20" y="785" width="320" height="95" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="180.0" y="817" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937">Factual + alternative explanations</text><text x="180.0" y="842" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Model responses + reported ranges</text><text x="20" y="950" font-family="sans-serif" font-size="13" fill="#a64b0a">White: conventional steps · Orange: CE additions</text></svg>