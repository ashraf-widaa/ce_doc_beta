<path d="M180 1383V1413" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M180 1525V1555" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M338 237H350V499H338" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M22 854H9V1080H22" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<g class="node"><rect x="22" y="80" width="316" height="77" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="115.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Training data</text>
<text x="180.0" y="139.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Features + known targets</text>
</g>
<g class="node"><rect x="22" y="187" width="316" height="98" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="233.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Fit the predictive model</text>
<text x="180.0" y="257.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Produces the fitted model</text>
</g>
<g class="node"><rect x="22" y="315" width="316" height="98" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="180.0" y="349.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Calibration data</text>
<text x="180.0" y="373.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Separate features + targets</text>
<text x="180.0" y="397.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Used with the fitted model</text>
</g>
<g class="node"><rect x="22" y="443" width="316" height="112" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="180.0" y="484.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Configure CE</text>
<text x="180.0" y="508.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Same fitted model + CE state</text>
<text x="180.0" y="532.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Includes calibration references</text>
</g>
<g class="node"><rect x="12" y="600" width="336" height="48" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="633.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">2 · Evaluate — held-out test</text>
</g>
<g class="node"><rect x="22" y="672" width="316" height="103" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="708.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Test features → same system</text>
<text x="180.0" y="732.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Predict or explain test cases</text>
<text x="180.0" y="756.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">No test targets in these calls</text>
</g>
<g class="node"><rect x="22" y="805" width="316" height="98" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="180.0" y="851.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Test outputs</text>
<text x="180.0" y="875.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Retain the results for checking</text>
</g>
<g class="node"><rect x="22" y="940" width="316" height="63" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="968.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Test targets</text>
<text x="180.0" y="992.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Kept for evaluation only</text>
</g>
<path d="M180 1003V1033" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<g class="node"><rect x="22" y="1033" width="316" height="97" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="1066.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Check results</text>
<text x="180.0" y="1090.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Compare outputs with targets</text>
<text x="180.0" y="1114.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Keep fitting/calibration separate</text>
</g>
<g class="node"><rect x="12" y="1210" width="336" height="48" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="1243.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">3 · Use — a new case</text>
</g>
<g class="node"><rect x="22" y="1285" width="316" height="98" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="1319.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">New-case features</text>
<text x="180.0" y="1343.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Target not required</text>
<text x="180.0" y="1367.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Choose the output question</text>
</g>
<g class="node"><rect x="22" y="1413" width="316" height="112" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="180.0" y="1454.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Reuse the same CE system</text>
<text x="180.0" y="1478.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Fitted model + calibration state</text>
<text x="180.0" y="1502.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Predictive model stays fixed</text>
</g>
<g class="node"><rect x="22" y="1555" width="316" height="112" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="180.0" y="1596.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">Prediction information</text>
<text x="180.0" y="1620.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">Probability or numerical value</text>
<text x="180.0" y="1644.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#334155">With a mode-specific range</text>
</g>
