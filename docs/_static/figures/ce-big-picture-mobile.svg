<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1120" role="img" aria-labelledby="title desc">
  <title id="title">What Calibrated Explanations adds to a supervised prediction workflow</title>
  <desc id="desc">White boxes show model fitting and conventional prediction. Orange boxes show separate labelled calibration data and CE using the same fitted model and new-case features. CE provides prediction information with a task-specific range, factual conditions with comparison weights and ranges, and alternative conditions with predictions and ranges. The four output boxes distinguish quantities, not a required order of API calls. The background is transparent.</desc>
  <defs>
    <marker id="ml" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10Z" fill="#64748b" />
    </marker>
    <marker id="ce" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10Z" fill="#c2410c" />
    </marker>
  </defs>
  <path d="M180 126 V160" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ml)" />
  <path d="M180 236 V270" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ml)" />
  <path d="M340 198 H350 V518 H340" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ce)" />
  <path d="M180 440 V480" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ce)" />
  <path d="M180 556 V580 H10 V640 H30" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ce)" />
  <path d="M180 556 V580 H10 V750 H30" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ce)" />
  <path d="M180 556 V580 H10 V860 H30" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ce)" />
  <path d="M180 556 V580 H10 V970 H30" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ce)" />
  <g class="box">
    <rect x="20" y="10" width="320" height="34" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <text x="180.0" y="34.5" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1f2937">Conventional prediction</text>
  </g>
  <g class="box">
    <rect x="20" y="60" width="320" height="66" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <text x="180.0" y="89.5" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1f2937">Training data</text>
    <text x="180.0" y="111.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">Features and known targets</text>
  </g>
  <g class="box">
    <rect x="20" y="160" width="320" height="76" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <text x="180.0" y="194.5" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1f2937">Fitted model</text>
    <text x="180.0" y="216.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">Predict using new-case features</text>
  </g>
  <g class="box">
    <rect x="20" y="270" width="320" height="66" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <text x="180.0" y="299.5" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1f2937">Conventional prediction</text>
    <text x="180.0" y="321.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">A class, value or score</text>
  </g>
  <g class="box">
    <rect x="20" y="370" width="320" height="70" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text x="180.0" y="401.5" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#9a3412">Calibration data</text>
    <text x="180.0" y="423.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">Separate labelled cases; not used to fit</text>
  </g>
  <g class="box">
    <rect x="20" y="480" width="320" height="76" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text x="180.0" y="514.5" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#9a3412">Calibrated Explanations</text>
    <text x="180.0" y="536.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">Same model + new-case features</text>
  </g>
  <g class="box">
    <rect x="30" y="600" width="310" height="80" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text x="185.0" y="625.5" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#9a3412">Prediction</text>
    <text x="185.0" y="647.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">Class or event probability</text>
    <text x="185.0" y="669.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">OR numerical target value</text>
  </g>
  <g class="box">
    <rect x="30" y="710" width="310" height="80" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text x="185.0" y="735.5" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#9a3412">Reported range</text>
    <text x="185.0" y="757.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">Probability bounds OR</text>
    <text x="185.0" y="779.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">target-value interval</text>
  </g>
  <g class="box">
    <rect x="30" y="820" width="310" height="80" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text x="185.0" y="845.5" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#9a3412">Factual explanation</text>
    <text x="185.0" y="867.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">Condition + comparison weight</text>
    <text x="185.0" y="889.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">with its reported range</text>
  </g>
  <g class="box">
    <rect x="30" y="930" width="310" height="80" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text x="185.0" y="955.5" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#9a3412">Alternative explanation</text>
    <text x="185.0" y="977.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">Different condition + prediction</text>
    <text x="185.0" y="999.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">with its reported range</text>
  </g>
  <g class="box">
    <rect x="20" y="1040" width="320" height="60" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <text x="180.0" y="1066.5" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1f2937">White: conventional · Orange: CE</text>
    <text x="180.0" y="1088.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">Output types, not required call order.</text>
  </g>
</svg>